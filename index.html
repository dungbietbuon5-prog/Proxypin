<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aimlock Antena</title>
    <style>
        /* Thiết lập nền tối giống ảnh */
        body {
            background-color: #0d0b14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Khung chứa nút */
        .control-panel {
            background: linear-gradient(145deg, #1a1625, #131019);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.05);
            text-align: center;
            border: 1px solid #2a223a;
        }

        /* Tiêu đề */
        .control-panel h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 20px;
            color: #e0d6ff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Container của nút gạt */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .toggle-label {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }

        /* Ẩn input checkbox mặc định */
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }

        /* Tạo hình dáng nút gạt */
        .switch {
            position: relative;
            display: inline-block;
            width: 70px;
            height: 34px;
        }

        /* Nền nút gạt khi tắt (Màu tối) */
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #2a223a;
            transition: .4s;
            border-radius: 34px;
            border: 1px solid #3b2e52;
        }

        /* Nút tròn nhỏ bên trong */
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Trạng thái khi BẬT (Màu Gradient Hồng - Tím) */
        input:checked + .slider {
            background: linear-gradient(90deg, #ff5e7e, #a855f7);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
            border: none;
        }

        /* Di chuyển nút tròn khi bật */
        input:checked + .slider:before {
            transform: translateX(36px);
        }
        
        /* Hiệu ứng chữ phát sáng khi bật (tuỳ chọn) */
        input:checked ~ .toggle-container .toggle-label {
            color: #ff5e7e;
            text-shadow: 0 0 10px rgba(255, 94, 126, 0.8);
        }

    </style>
</head>
<body>

    <div class="control-panel">
        <h2>SORA UI</h2>
        
        <div class="toggle-container">
            <span class="toggle-label">Aimlock Antena</span>
            
            <label class="switch">
                <!-- Checkbox này chỉ để hiển thị UI, không có tác dụng với game -->
                <input type="checkbox" id="aimToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

</body>
</html>
